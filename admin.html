<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPL 관리자</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
}

header {
    background: #111827;
    color: white;
    padding: 20px;
    text-align: center;
}

main {
    max-width: 900px;
    margin: 20px auto;
    padding: 15px;
}

.box {
    background: white;
    padding: 20px;
    margin-bottom: 15px;
    border-radius: 12px;
}

button {
    padding: 12px;
    margin: 5px;
    border: 0;
    border-radius: 8px;
    background: #111827;
    color: white;
    cursor: pointer;
}

input, select, textarea {
    width: 100%;
    padding: 10px;
    margin: 6px 0 12px;
    box-sizing: border-box;
}

.page {
    display: none;
}

.page.active {
    display: block;
}

.hidden {
    display: none;
}

#message {
    margin-top: 15px;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h1>⚾ CPL 관리자</h1>
    <p>Cheonjung Premier League</p>
</header>

<main>

<!-- 로그인 -->

<div id="login" class="box">

    <h2>🔐 관리자 로그인</h2>

    <input id="adminId" placeholder="아이디">

    <input
        id="adminPassword"
        type="password"
        placeholder="비밀번호"
    >

    <button onclick="loginAdmin()">로그인</button>

    <p id="loginMessage"></p>

</div>


<!-- 관리자 화면 -->

<div id="admin" class="hidden">

    <div class="box">

        <h2>관리 메뉴</h2>

        <button onclick="showPage('home')">🏠 홈</button>
        <button onclick="showPage('games')">⚾ 경기</button>
        <button onclick="showPage('schedule')">📅 일정</button>
        <button onclick="showPage('standings')">🏆 순위</button>
        <button onclick="showPage('teams')">👥 팀</button>
        <button onclick="showPage('players')">👤 선수</button>
        <button onclick="showPage('records')">📊 기록</button>
        <button onclick="showPage('news')">📰 뉴스</button>

    </div>


    <!-- 홈 -->

    <div id="home" class="box page active">

        <h2>🏠 홈 관리</h2>

        <label>사이트 제목</label>
        <input id="homeTitle">

        <label>공지</label>
        <textarea id="homeNotice"></textarea>

        <button onclick="saveHome()">
            💾 저장
        </button>

    </div>


    <!-- 경기 -->

    <div id="games" class="box page">

        <h2>⚾ 경기 관리</h2>

        <label>날짜</label>
        <input id="gameDate" type="date">

        <label>팀 1</label>
        <input id="gameTeam1">

        <label>팀 1 점수</label>
        <input id="gameScore1" type="number">

        <label>팀 2</label>
        <input id="gameTeam2">

        <label>팀 2 점수</label>
        <input id="gameScore2" type="number">

        <label>경기 내용</label>
        <textarea id="gameDescription"></textarea>

        <button onclick="saveGame()">
            💾 경기 저장
        </button>

    </div>


    <!-- 일정 -->

    <div id="schedule" class="box page">

        <h2>📅 일정 관리</h2>

        <label>날짜</label>
        <input id="scheduleDate" type="date">

        <label>시간</label>
        <input id="scheduleTime" type="time">

        <label>팀 1</label>
        <input id="scheduleTeam1">

        <label>팀 2</label>
        <input id="scheduleTeam2">

        <button onclick="saveSchedule()">
            💾 일정 저장
        </button>

    </div>


    <!-- 순위 -->

    <div id="standings" class="box page">

        <h2>🏆 순위 관리</h2>

        <label>팀</label>
        <input id="standingTeam">

        <label>승</label>
        <input id="standingWins" type="number">

        <label>무</label>
        <input id="standingDraws" type="number">

        <label>패</label>
        <input id="standingLosses" type="number">

        <label>승점</label>
        <input id="standingPoints" type="number">

        <button onclick="saveStanding()">
            💾 순위 저장
        </button>

    </div>


    <!-- 팀 -->

    <div id="teams" class="box page">

        <h2>👥 팀 관리</h2>

        <label>팀 이름</label>
        <input id="teamName">

        <label>팀 색상</label>
        <input id="teamColor">

        <label>팀 소개</label>
        <textarea id="teamDescription"></textarea>

        <button onclick="saveTeam()">
            💾 팀 저장
        </button>

    </div>


    <!-- 선수 -->

    <div id="players" class="box page">

        <h2>👤 선수 관리</h2>

        <label>선수 이름</label>
        <input id="playerName">

        <label>팀</label>
        <input id="playerTeam">

        <label>포지션</label>
        <input id="playerPosition">

        <label>소개</label>
        <textarea id="playerDescription"></textarea>

        <button onclick="savePlayer()">
            💾 선수 저장
        </button>

    </div>


    <!-- 기록 -->

    <div id="records" class="box page">

        <h2>📊 기록 관리</h2>

        <label>선수</label>
        <input id="recordPlayer">

        <label>팀</label>
        <input id="recordTeam">

        <label>안타</label>
        <input id="recordHits" type="number">

        <label>홈런</label>
        <input id="recordHomeRuns" type="number">

        <label>타점</label>
        <input id="recordRBI" type="number">

        <button onclick="saveRecord()">
            💾 기록 저장
        </button>

    </div>


    <!-- 뉴스 -->

    <div id="news" class="box page">

        <h2>📰 뉴스 관리</h2>

        <label>날짜</label>
        <input id="newsDate" type="date">

        <label>제목</label>
        <input id="newsTitle">

        <label>내용</label>
        <textarea id="newsContent"></textarea>

        <button onclick="saveNews()">
            💾 뉴스 저장
        </button>

    </div>


    <p id="message"></p>

</div>

</main>


<script>

/* =========================
   SUPABASE 연결
========================= */

const SUPABASE_URL =
"https://eyxffvsoohftthklhoex.supabase.co";

const SUPABASE_KEY =
"sb_publishable_JxfY2t21jzYLS5E04JqdTQ_xca235Hr";


/* =========================
   로그인
========================= */

function loginAdmin() {

    const id =
        document.getElementById("adminId").value;

    const password =
        document.getElementById("adminPassword").value;

    if (
        id === "260820" &&
        password === "CPL2026"
    ) {

        document
            .getElementById("login")
            .classList.add("hidden");

        document
            .getElementById("admin")
            .classList.remove("hidden");

    } else {

        document
            .getElementById("loginMessage")
            .innerText =
            "❌ 로그인 정보가 틀렸습니다.";

    }
}


/* =========================
   메뉴
========================= */

function showPage(id) {

    const pages =
        document.querySelectorAll(".page");

    pages.forEach(page => {
        page.classList.remove("active");
    });

    document
        .getElementById(id)
        .classList.add("active");
}


/* =========================
   Supabase 저장 함수
========================= */

async function insertData(table, data) {

    const response =
        await fetch(
            SUPABASE_URL +
            "/rest/v1/" +
            table,
            {
                method: "POST",

                headers: {
                    "apikey": SUPABASE_KEY,

                    "Authorization":
                        "Bearer " + SUPABASE_KEY,

                    "Content-Type":
                        "application/json",

                    "Prefer":
                        "return=representation"
                },

                body:
                    JSON.stringify(data)
            }
        );

    if (!response.ok) {

        const error =
            await response.text();

        throw new Error(error);
    }

    return await response.json();
}


/* =========================
   홈
========================= */

async function saveHome() {

    try {

        await insertData(
            "site_settings",
            {
                title:
                    document
                    .getElementById("homeTitle")
                    .value,

                notice:
                    document
                    .getElementById("homeNotice")
                    .value
            }
        );

        showMessage("✅ 홈 저장 완료");

    } catch(error) {

        console.error(error);

        showMessage("❌ 홈 저장 실패");
    }
}


/* =========================
   경기
========================= */

async function saveGame() {

    try {

        await insertData(
            "games",
            {
                game_date:
                    document
                    .getElementById("gameDate")
                    .value,

                team1:
                    document
                    .getElementById("gameTeam1")
                    .value,

                score1:
                    Number(
                        document
                        .getElementById("gameScore1")
                        .value
                    ),

                team2:
                    document
                    .getElementById("gameTeam2")
                    .value,

                score2:
                    Number(
                        document
                        .getElementById("gameScore2")
                        .value
                    ),

                description:
                    document
                    .getElementById("gameDescription")
                    .value
            }
        );

        showMessage("✅ 경기 저장 완료");

    } catch(error) {

        console.error(error);

        showMessage("❌ 경기 저장 실패");
    }
}


/* =========================
   일정
========================= */

async function saveSchedule() {

    try {

        await insertData(
            "schedules",
            {
                game_date:
                    document
                    .getElementById("scheduleDate")
                    .value,

                game_time:
                    document
                    .getElementById("scheduleTime")
                    .value,

                team1:
                    document
                    .getElementById("scheduleTeam1")
                    .value,

                team2:
                    document
                    .getElementById("scheduleTeam2")
                    .value
            }
        );

        showMessage("✅ 일정 저장 완료");

    } catch(error) {

        console.error(error);

        showMessage("❌ 일정 저장 실패");
    }
}


/* =========================
   순위
========================= */

async function saveStanding() {

    try {

        await insertData(
            "standings",
            {
                team:
                    document
                    .getElementById("standingTeam")
                    .value,

                wins:
                    Number(
                        document
                        .getElementById("standingWins")
                        .value
                    ),

                draws:
                    Number(
                        document
                        .getElementById("standingDraws")
                        .value
                    ),

                losses:
                    Number(
                        document
                        .getElementById("standingLosses")
                        .value
                    ),

                points:
                    Number(
                        document
                        .getElementById("standingPoints")
                        .value
                    )
            }
        );

        showMessage("✅ 순위 저장 완료");

    } catch(error) {

        console.error(error);

        showMessage("❌ 순위 저장 실패");
    }
}


/* =========================
   팀
========================= */

async function saveTeam() {

    try {

        await insertData(
            "teams",
            {
                name:
                    document
                    .getElementById("teamName")
                    .value,

                color:
                    document
                    .getElementById("teamColor")
                    .value,

                description:
                    document
                    .getElementById("teamDescription")
                    .value
            }
        );

        showMessage("✅ 팀 저장 완료");

    } catch(error) {

        console.error(error);

        showMessage("❌ 팀 저장 실패");
    }
}


/* =========================
   선수
========================= */

async function savePlayer() {

    try {

        await insertData(
            "players",
            {
                name:
                    document
                    .getElementById("playerName")
                    .value,

                team:
                    document
                    .getElementById("playerTeam")
                    .value,

                position:
                    document
                    .getElementById("playerPosition")
                    .value,

                description:
                    document
                    .getElementById("playerDescription")
                    .value
            }
        );

        showMessage("✅ 선수 저장 완료");

    } catch(error) {

        console.error(error);

        showMessage("❌ 선수 저장 실패");
    }
}


/* =========================
   기록
========================= */

async function saveRecord() {

    try {

        await insertData(
            "records",
            {
                player:
                    document
                    .getElementById("recordPlayer")
                    .value,

                team:
                    document
                    .getElementById("recordTeam")
                    .value,

                hits:
                    Number(
                        document
                        .getElementById("recordHits")
                        .value
                    ),

                home_runs:
                    Number(
                        document
                        .getElementById("recordHomeRuns")
                        .value
                    ),

                rbi:
                    Number(
                        document
                        .getElementById("recordRBI")
                        .value
                    )
            }
        );

        showMessage("✅ 기록 저장 완료");

    } catch(error) {

        console.error(error);

        showMessage("❌ 기록 저장 실패");
    }
}


/* =========================
   뉴스
========================= */

async function saveNews() {

    try {

        await insertData(
            "news",
            {
                news_date:
                    document
                    .getElementById("newsDate")
                    .value,

                title:
                    document
                    .getElementById("newsTitle")
                    .value,

                content:
                    document
                    .getElementById("newsContent")
                    .value
            }
        );

        showMessage("✅ 뉴스 저장 완료");

    } catch(error) {

        console.error(error);

        showMessage("❌ 뉴스 저장 실패");
    }
}


/* =========================
   메시지
========================= */

function showMessage(text) {

    document
        .getElementById("message")
        .innerText = text;
}

</script>

</body>
</html>
