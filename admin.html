<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPL 관리자</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#111;
}

header{
  background:#111827;
  color:white;
  padding:20px;
  text-align:center;
}

.container{
  max-width:800px;
  margin:25px auto;
  padding:15px;
}

.card{
  background:white;
  padding:20px;
  margin-bottom:20px;
  border-radius:15px;
  box-shadow:0 3px 12px #0002;
}

input,select,textarea{
  width:100%;
  padding:12px;
  margin:7px 0 15px;
  box-sizing:border-box;
  border:1px solid #ccc;
  border-radius:8px;
}

button{
  padding:12px 18px;
  border:0;
  border-radius:8px;
  background:#111827;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.hidden{
  display:none;
}

.item{
  border:1px solid #ddd;
  padding:15px;
  border-radius:10px;
  margin-top:10px;
}
</style>
</head>

<body>

<header>
<h1>⚾ CPL 관리자</h1>
<p>Cheonjung Premier League 2026</p>
</header>

<div class="container">

<!-- 로그인 -->
<div class="card" id="loginBox">
<h2>🔐 관리자 로그인</h2>

<label>아이디</label>
<input id="userId" type="text">

<label>비밀번호</label>
<input id="password" type="password">

<button onclick="login()">로그인</button>

<p id="loginMessage"></p>
</div>


<!-- 관리자 -->
<div id="adminPanel" class="hidden">

<div class="card">
<h2>🏠 메인 관리</h2>

<label>메인 제목</label>
<input id="mainTitle">

<label>메인 공지</label>
<textarea id="mainNotice"></textarea>

<button onclick="saveMain()">메인 저장</button>
</div>


<div class="card">
<h2>⚾ 경기 결과</h2>

<label>날짜</label>
<input id="gameDate" type="date">

<label>팀 1</label>
<select id="team1">
<option>해찬</option>
<option>시환</option>
<option>재우</option>
<option>준열</option>
</select>

<label>팀 1 점수</label>
<input id="score1" type="number" min="0">

<label>팀 2</label>
<select id="team2">
<option>준열</option>
<option>해찬</option>
<option>시환</option>
<option>재우</option>
</select>

<label>팀 2 점수</label>
<input id="score2" type="number" min="0">

<label>경기 내용</label>
<textarea id="gameNews"></textarea>

<button onclick="saveGame()">경기 결과 추가</button>

<div id="gameList"></div>
</div>


<div class="card">
<h2>📅 일정</h2>

<label>날짜</label>
<input id="scheduleDate" type="date">

<label>시간</label>
<input id="scheduleTime" type="time">

<label>대진</label>
<input id="scheduleMatch" placeholder="해찬 vs 준열">

<button onclick="saveSchedule()">일정 추가</button>

<div id="scheduleList"></div>
</div>


<div class="card">
<h2>👥 팀 관리</h2>

<select id="teamName">
<option>해찬</option>
<option>시환</option>
<option>재우</option>
<option>준열</option>
</select>

<label>팀 소개</label>
<textarea id="teamInfo"></textarea>

<button onclick="saveTeam()">팀 정보 저장</button>
</div>


<div class="card">
<h2>👤 선수 관리</h2>

<label>선수 이름</label>
<input id="playerName">

<label>소속팀</label>
<select id="playerTeam">
<option>해찬</option>
<option>시환</option>
<option>재우</option>
<option>준열</option>
</select>

<label>선수 정보</label>
<textarea id="playerInfo"></textarea>

<button onclick="savePlayer()">선수 정보 저장</button>
</div>


<div class="card">
<h2>📊 기록 관리</h2>

<label>선수</label>
<input id="recordPlayer">

<label>안타</label>
<input id="hits" type="number" min="0">

<label>홈런</label>
<input id="homeRuns" type="number" min="0">

<label>타점</label>
<input id="rbi" type="number" min="0">

<button onclick="saveRecord()">기록 저장</button>
</div>


<div class="card">
<h2>📰 뉴스 관리</h2>

<label>날짜</label>
<input id="newsDate" type="date">

<label>제목</label>
<input id="newsTitle">

<label>내용</label>
<textarea id="newsContent"></textarea>

<button onclick="saveNews()">뉴스 추가</button>

<div id="newsList"></div>
</div>


<div class="card">
<h2>⚙️ 리그 정보</h2>

<label>리그 이름</label>
<input id="leagueName" value="천중 리그">

<label>영문 이름</label>
<input id="englishName" value="Cheonjung Premier League">

<label>시즌</label>
<input id="season" value="2026 시즌">

<label>슬로건</label>
<input id="slogan" value="One Season. One Champion.">

<button onclick="saveLeague()">리그 정보 저장</button>
</div>

</div>
</div>


<script>

/* 임시 로그인
   실제 공개 사이트에서는 이 방식으로 비밀번호를 보관하면 안 됨.
*/
function login(){

  const id = document.getElementById("userId").value;
  const pw = document.getElementById("password").value;

  if(id === "260820" && pw === "CPL2026"){
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("adminPanel").classList.remove("hidden");
  }
  else{
    document.getElementById("loginMessage").innerText =
      "아이디 또는 비밀번호가 올바르지 않습니다.";
  }
}


/* 메인 */
function saveMain(){

  localStorage.setItem(
    "mainTitle",
    document.getElementById("mainTitle").value
  );

  localStorage.setItem(
    "mainNotice",
    document.getElementById("mainNotice").value
  );

  alert("메인 정보가 저장되었습니다.");
}


/* 경기 */
function saveGame(){

  const game = {
    date: document.getElementById("gameDate").value,
    team1: document.getElementById("team1").value,
    score1: document.getElementById("score1").value,
    team2: document.getElementById("team2").value,
    score2: document.getElementById("score2").value,
    news: document.getElementById("gameNews").value
  };

  const games =
    JSON.parse(localStorage.getItem("games") || "[]");

  games.push(game);

  localStorage.setItem("games", JSON.stringify(games));

  showGames();

  alert("경기 결과가 저장되었습니다.");
}

function showGames(){

  const games =
    JSON.parse(localStorage.getItem("games") || "[]");

  document.getElementById("gameList").innerHTML =
    games.map((g,i)=>`
      <div class="item">
        📅 ${g.date}<br>
        ⚾ ${g.team1} ${g.score1} : ${g.score2} ${g.team2}<br>
        📰 ${g.news}
      </div>
    `).join("");
}


/* 일정 */
function saveSchedule(){

  const schedule = {
    date: document.getElementById("scheduleDate").value,
    time: document.getElementById("scheduleTime").value,
    match: document.getElementById("scheduleMatch").value
  };

  localStorage.setItem(
    "schedule",
    JSON.stringify(schedule)
  );

  alert("일정이 저장되었습니다.");
}


/* 팀 */
function saveTeam(){

  const team =
    document.getElementById("teamName").value;

  const info =
    document.getElementById("teamInfo").value;

  localStorage.setItem(
    "team_" + team,
    info
  );

  alert(team + " 팀 정보가 저장되었습니다.");
}


/* 선수 */
function savePlayer(){

  const player = {
    name: document.getElementById("playerName").value,
    team: document.getElementById("playerTeam").value,
    info: document.getElementById("playerInfo").value
  };

  localStorage.setItem(
    "player_" + player.name,
    JSON.stringify(player)
  );

  alert("선수 정보가 저장되었습니다.");
}


/* 기록 */
function saveRecord(){

  const record = {
    player: document.getElementById("recordPlayer").value,
    hits: document.getElementById("hits").value,
    homeRuns: document.getElementById("homeRuns").value,
    rbi: document.getElementById("rbi").value
  };

  localStorage.setItem(
    "record_" + record.player,
    JSON.stringify(record)
  );

  alert("선수 기록이 저장되었습니다.");
}


/* 뉴스 */
function saveNews(){

  const news = {
    date: document.getElementById("newsDate").value,
    title: document.getElementById("newsTitle").value,
    content: document.getElementById("newsContent").value
  };

  const newsList =
    JSON.parse(localStorage.getItem("news") || "[]");

  newsList.push(news);

  localStorage.setItem(
    "news",
    JSON.stringify(newsList)
  );

  showNews();

  alert("뉴스가 추가되었습니다.");
}

function showNews(){

  const news =
    JSON.parse(localStorage.getItem("news") || "[]");

  document.getElementById("newsList").innerHTML =
    news.map(n=>`
      <div class="item">
        📅 ${n.date}<br>
        <strong>${n.title}</strong><br>
        ${n.content}
      </div>
    `).join("");
}


/* 리그 */
function saveLeague(){

  localStorage.setItem(
    "leagueName",
    document.getElementById("leagueName").value
  );

  localStorage.setItem(
    "englishName",
    document.getElementById("englishName").value
  );

  localStorage.setItem(
    "season",
    document.getElementById("season").value
  );

  localStorage.setItem(
    "slogan",
    document.getElementById("slogan").value
  );

  alert("리그 정보가 저장되었습니다.");
}

showGames();
showNews();

</script>

</body>
</html>
