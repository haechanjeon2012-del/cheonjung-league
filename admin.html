<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPL 통합 관리자</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

header{
    background:#111827;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    max-width:1000px;
    margin:25px auto;
    padding:15px;
}

.card{
    background:white;
    padding:25px;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.menu{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

button{
    border:0;
    padding:13px;
    border-radius:8px;
    background:#111827;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.85;
}

input,select,textarea{
    width:100%;
    padding:11px;
    margin:7px 0 14px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

textarea{
    min-height:100px;
}

.section{
    display:none;
}

.section.active{
    display:block;
}

.hidden{
    display:none;
}

.message{
    margin-top:15px;
    font-weight:bold;
}

.danger{
    background:#dc2626;
}
</style>
</head>

<body>

<header>
<h1>⚾ CPL 통합 관리자</h1>
<p>Cheonjung Premier League 2026</p>
</header>

<div class="container">

<!-- 로그인 -->
<div id="loginBox" class="card">

<h2>🔐 관리자 로그인</h2>

<label>아이디</label>
<input id="adminId" placeholder="관리자 아이디">

<label>비밀번호</label>
<input id="adminPassword" type="password" placeholder="비밀번호">

<button onclick="login()">로그인</button>

<div id="loginMessage" class="message"></div>

</div>


<!-- 관리자 -->
<div id="adminPanel" class="hidden">

<div class="card">

<h2>관리 메뉴</h2>

<div class="menu">

<button onclick="openPage('home')">🏠 홈</button>
<button onclick="openPage('games')">⚾ 경기</button>
<button onclick="openPage('schedule')">📅 일정</button>
<button onclick="openPage('standings')">🏆 순위</button>

<button onclick="openPage('teams')">👥 팀</button>
<button onclick="openPage('players')">👤 선수</button>
<button onclick="openPage('records')">📊 기록</button>
<button onclick="openPage('news')">📰 뉴스</button>

</div>

</div>


<!-- 홈 -->
<div id="home" class="section active card">

<h2>🏠 홈 관리</h2>

<label>사이트 제목</label>
<input id="homeTitle">

<label>메인 공지</label>
<textarea id="homeNotice"></textarea>

<label>메인 배너</label>
<input id="homeBanner">

<button onclick="save('site_settings',{
title:homeTitle.value,
notice:homeNotice.value,
banner:homeBanner.value
})">
💾 홈 저장
</button>

<div id="homeMsg" class="message"></div>

</div>


<!-- 경기 -->
<div id="games" class="section card">

<h2>⚾ 경기 관리</h2>

<label>경기 날짜</label>
<input id="gameDate" type="date">

<label>팀 1</label>
<select id="gameTeam1">
<option>해찬</option>
<option>시환</option>
<option>재우</option>
<option>준열</option>
</select>

<label>팀 1 점수</label>
<input id="gameScore1" type="number" min="0">

<label>팀 2</label>
<select id="gameTeam2">
<option>준열</option>
<option>해찬</option>
<option>시환</option>
<option>재우</option>
</select>

<label>팀 2 점수</label>
<input id="gameScore2" type="number" min="0">

<label>경기 내용</label>
<textarea id="gameDescription"></textarea>

<button onclick="save('games',{
game_date:gameDate.value,
team1:gameTeam1.value,
score1:Number(gameScore1.value),
team2:gameTeam2.value,
score2:Number(gameScore2.value),
description:gameDescription.value
})">
💾 경기 저장
</button>

<div id="gamesMsg" class="message"></div>

</div>


<!-- 일정 -->
<div id="schedule" class="section card">

<h2>📅 일정 관리</h2>

<label>날짜</label>
<input id="scheduleDate" type="date">

<label>시간</label>
<input id="scheduleTime" type="time">

<label>홈 팀</label>
<input id="scheduleTeam1">

<label>원정 팀</label>
<input id="scheduleTeam2">

<button onclick="save('schedules',{
game_date:scheduleDate.value,
game_time:scheduleTime.value,
team1:scheduleTeam1.value,
team2:scheduleTeam2.value
})">
💾 일정 저장
</button>

<div id="scheduleMsg" class="message"></div>

</div>


<!-- 순위 -->
<div id="standings" class="section card">

<h2>🏆 순위 관리</h2>

<label>팀</label>
<input id="standingTeam">

<label>승</label>
<input id="standingWins" type="number">

<label>무</label>
<input id="standingDraws" type="number">

<label>패</label>
<input id="standingLosses" type="number">

<label>승점</label>
<input id="standingPoints" type="number">

<button onclick="save('standings',{
team:standingTeam.value,
wins:Number(standingWins.value),
draws:Number(standingDraws.value),
losses:Number(standingLosses.value),
points:Number(standingPoints.value)
})">
💾 순위 저장
</button>

<div id="standingsMsg" class="message"></div>

</div>


<!-- 팀 -->
<div id="teams" class="section card">

<h2>👥 팀 관리</h2>

<label>팀 이름</label>
<input id="teamName">

<label>팀 색상</label>
<input id="teamColor">

<label>팀 소개</label>
<textarea id="teamDescription"></textarea>

<button onclick="save('teams',{
name:teamName.value,
color:teamColor.value,
description:teamDescription.value
})">
💾 팀 저장
</button>

<div id="teamsMsg" class="message"></div>

</div>


<!-- 선수 -->
<div id="players" class="section card">

<h2>👤 선수 관리</h2>

<label>선수 이름</label>
<input id="playerName">

<label>팀</label>
<input id="playerTeam">

<label>포지션</label>
<input id="playerPosition">

<label>선수 소개</label>
<textarea id="playerDescription"></textarea>

<button onclick="save('players',{
name:playerName.value,
team:playerTeam.value,
position:playerPosition.value,
description:playerDescription.value
})">
💾 선수 저장
</button>

<div id="playersMsg" class="message"></div>

</div>


<!-- 기록 -->
<div id="records" class="section card">

<h2>📊 기록 관리</h2>

<label>선수</label>
<input id="recordPlayer">

<label>팀</label>
<input id="recordTeam">

<label>안타</label>
<input id="recordHits" type="number">

<label>홈런</label>
<input id="recordHR" type="number">

<label>타점</label>
<input id="recordRBI" type="number">

<label>승리</label>
<input id="recordWins" type="number">

<label>패배</label>
<input id="recordLosses" type="number">

<button onclick="save('records',{
player:recordPlayer.value,
team:recordTeam.value,
hits:Number(recordHits.value),
home_runs:Number(recordHR.value),
rbi:Number(recordRBI.value),
wins:Number(recordWins.value),
losses:Number(recordLosses.value)
})">
💾 기록 저장
</button>

<div id="recordsMsg" class="message"></div>

</div>


<!-- 뉴스 -->
<div id="news" class="section card">

<h2>📰 뉴스 관리</h2>

<label>날짜</label>
<input id="newsDate" type="date">

<label>뉴스 제목</label>
<input id="newsTitle">

<label>뉴스 내용</label>
<textarea id="newsContent"></textarea>

<button onclick="save('news',{
news_date:newsDate.value,
title:newsTitle.value,
content:newsContent.value
})">
💾 뉴스 저장
</button>

<div id="newsMsg" class="message"></div>

</div>

</div>

</div>


<script>

/* =========================
   SUPABASE 연결
========================= */

const SUPABASE_URL =
"https://eyxffvsoohftthklhoex.supabase.co";

const SUPABASE_KEY =
"여기에_네_게시_가능한_키";


/* =========================
   관리자 로그인
========================= */

function login(){

const id =
document.getElementById("adminId").value;

const password =
document.getElementById("adminPassword").value;

if(id==="260820" && password==="CPL2026"){

document
.getElementById("loginBox")
.classList.add("hidden");

document
.getElementById("adminPanel")
.classList.remove("hidden");

}else{

document
.getElementById("loginMessage")
.innerText=
"❌ 아이디 또는 비밀번호가 틀렸습니다.";

}

}


/* =========================
   메뉴 열기
========================= */

function openPage(id){

document
.querySelectorAll(".section")
.forEach(x=>{
x.classList.remove("active");
});

document
.getElementById(id)
.classList.add("active");

}


/* =========================
   Supabase 저장
========================= */

async function save(table,data){

try{

const response =
await fetch(
SUPABASE_URL+
"/rest/v1/"+
table,
{
method:"POST",

headers:{
"apikey":SUPABASE_KEY,
"Authorization":
"Bearer "+SUPABASE_KEY,
"Content-Type":
"application/json",
"Prefer":
"return=representation"
},

body:
JSON.stringify(data)

}
);

const result =
await response.text();

console.log(result);

const msg =
document.getElementById(table+"Msg");

if(response.ok){

msg.innerText=
"✅ 저장되었습니다.";

}else{

msg.innerText=
"❌ 저장 실패";

console.error(result);

}

}catch(error){

console.error(error);

const msg =
document.getElementById(table+"Msg");

if(msg){
msg.innerText=
"❌ Supabase 연결 오류";
}

}

}

</script>

</body>
</html>
